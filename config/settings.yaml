# Weights, thresholds, models and prompt versions. Secrets live in .env.
# ${VAR:-default} is replaced from the environment.
# Defaults chosen from the providers' live model lists on 2026-11-19 (scripts/list_models.py [--provider gemini]).
# Extraction runs on Gemini; resume parsing, explanations, agent, judge and draft labels on Groq.
# Judge/draft labels use a different family (Qwen) from the pipeline models (Gemini, gpt-oss).
models:
  extract: ${EXTRACT_MODEL:-gemini-3.5-flash-lite}
  profile: ${PROFILE_MODEL:-openai/gpt-oss-20b}
  explain: ${EXPLAIN_MODEL:-openai/gpt-oss-20b}
  agent: ${AGENT_MODEL:-openai/gpt-oss-120b}
  judge: ${JUDGE_MODEL:-qwen/qwen3.8-27b}   # different model family from explain
role_providers: {extract: gemini, profile: groq, explain: groq, agent: groq, judge: groq}
providers:
  groq:
    tpm_limit: 8000               # measured: 8,000 tokens/min, 1,000 requests/day, 200K tokens/day per model
  gemini:
    rpm_limit: 10                 # no rate-limit headers; conservative free-tier pacing, 429s are retried
    tpm_limit: 200000
prompts: {facts: facts_v3, facts_paste: facts_v5, profile: profile_v1, explain: explain_v1, judge: judge_v1, agent: agent_v4}
llm:
  timeout_s: 60
  max_retries: 2
  max_input_tokens: 6000
  extract_max_chars: 8000       # ~2,000 tokens of job text; keeps each call ~2.5-4k tokens
  tpm_limit: 8000               # Groq free tier reports 8,000 tokens/min per account (429s are retried)
  model_params:                 # gpt-oss are reasoning models; low effort cut reasoning tokens 1046 -> 179 in a probe
    openai/gpt-oss-20b: {reasoning_effort: low}
    openai/gpt-oss-120b: {reasoning_effort: low}
embeddings:
  default_model: minilm
  default_variant: structured
  models:
    minilm: {name: sentence-transformers/all-MiniLM-L6-v2, query_prefix: ""}
    bge-small: {name: BAAI/bge-small-en-v1.5, query_prefix: "Represent this sentence for searching relevant passages: "}
  batch_size: 64
search: {rrf_k: 60, candidates: 50}
ranking: {w_retrieval: 0.65, w_skill: 0.35, check_penalty: 0.05, risky_factor: 0.7, caution_factor: 0.9}
trust:
  levels: {ok: 70, caution: 40}
  deltas: {age_60: -15, age_120: -30, repost: -10, money: -25, offplatform: -15,
           free_email: -10, unrealistic_pay: -10, missing_company: -10, classifier_max: -40}
  repost_min: 2
  unrealistic_intern_pay_inr_month: 200000
  classifier_path: models/scam_clf.joblib
agent: {max_steps: 6, history_messages: 10, summary_every: 6, tool_timeout_s: 10, temperature: 0.2}
budget:                          # each purpose counts only its own calls (agent never includes extraction)
  daily_tokens: 300000           # default per purpose
  per_purpose: {agent: 180000, summary: 20000, explain: 40000}   # Groq free tier: 200K tokens/day per model
ingest:
  requests_per_second: 2
  timeout_s: 15
  retries: 3
  user_agent: "JobLens/0.1 (open-source job matcher; public ATS board API client)"
  max_description_chars: 20000
  repost_window_days: 90
  # Cap per company to keep the pool at 300-1,000 jobs (India locations first, then newest). 0 = no cap.
  max_jobs_per_company: 20
  # Human-reviewed role-family decisions that win over the rules (job_key -> family + reason).
  role_family_overrides:
    "greenhouse:6115382004": {family: engineering, reason: "kept in scope by builder review 2026-11-19 (CloudSEK Security Consultant Intern)"}
    "greenhouse:5997804004": {family: engineering, reason: "kept in scope by builder review 2026-11-19 (CloudSEK Technical Security Consultant)"}
    "lever:137a91f9-d910-4d9d-8f42-6bf7a5aa6c86": {family: data_ml, reason: "kept in scope by builder review 2026-11-19 (Stable Money AI Product Builder)"}
  # Keep only jobs whose location looks like India or open remote. Empty list = keep all.
  india_keywords: [india, bengaluru, bangalore, hyderabad, pune, mumbai, delhi, "new delhi", gurugram, gurgaon,
                   noida, chennai, kolkata, ahmedabad, jaipur, kochi, coimbatore, indore, chandigarh, trivandrum,
                   thiruvananthapuram, mysore, mysuru, "ncr", patna, lucknow, bhubaneswar, nagpur, surat, vadodara,
                   visakhapatnam, vizag, mangaluru, mangalore, goa, guwahati, ranchi, dehradun, kanpur, varanasi,
                   # states / UTs (ATS boards often give "City, State")
                   karnataka, maharashtra, telangana, "tamil nadu", "uttar pradesh", bihar, kerala, gujarat, haryana,
                   "west bengal", rajasthan, odisha, punjab, "madhya pradesh", "andhra pradesh", assam, jharkhand,
                   uttarakhand, "himachal pradesh", chhattisgarh]
  remote_keywords: [remote, anywhere, worldwide, global, "work from home", wfh, apac, asia]
  remote_exclude: [us, usa, "u.s.", "united states", canada, uk, "united kingdom", europe, emea, eu, germany,
                   france, spain, brazil, latam, mexico, australia, "north america", americas, japan, singapore,
                   ireland, netherlands, poland, israel, "new york", "san francisco", london, berlin, toronto]
